apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-status
spec:
  replicas: 2
  selector:
    matchLabels: {app: service-status}
  template:
    metadata:
      labels: {app: service-status}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: service-status:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env: [{name: APP_HOST, value: "0.0.0.0"}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-status
spec:
  selector: {app: service-status}
  ports: [{name: http, port: 80, targetPort: http}]
  type: ClusterIP
