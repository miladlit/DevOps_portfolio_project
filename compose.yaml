name: devops-portfolio

services:
  app:
    build: .
    environment:
      APP_NAME: "${APP_NAME-Service Status}"
      APP_VERSION: "${APP_VERSION-0.1.0}"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
