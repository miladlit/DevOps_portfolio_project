name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: HTTP tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run HTTP tests
        run: bash scripts/test.sh

  proxy:
    name: Nginx integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx
      - name: Require Nginx and run proxy tests
        run: |
          command -v nginx
          python3 -m unittest discover -s tests -p test_proxy.py -v

  release:
    name: Build verified release
    needs: [tests, proxy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Package and smoke-test application
        run: python3 scripts/release.py HEAD
      - name: Verify release checksum
        working-directory: dist
        run: sha256sum -c *.sha256
      - name: Upload verified release
        uses: actions/upload-artifact@v7
        with:
          name: service-status-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
